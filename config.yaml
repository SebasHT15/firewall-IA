# firewall-IA — runtime configuration.
#
# Only the data plane (data_plane.py) reads this file today. The control plane
# (classifier_api.py) is still configured through FIREWALL_ADAPTER_DIR.
# Changes take effect when mitmdump is restarted.

data_plane:
  # Control plane classification endpoint (classifier_api.py, POST /classify).
  classifier_url: http://127.0.0.1:8000/classify

  # Operational limit for detecting a failed or hung classifier. It is NOT the
  # project's latency objective (D3, D35). httpx applies it to each phase of the
  # call (connect, send, wait for the response). When it expires the request is
  # blocked (fail-closed). 3 s is a conservative starting value, to be tuned with
  # end-to-end evidence.
  classifier_timeout_seconds: 3.0

  # Hybrid Architecture Phase 1 — request feature extraction in SHADOW mode
  # (Issue #49, D43).
  # true: every request is also described by data_plane/request_features.py and
  # the summary is logged ("FEATURE EXTRACTION (shadow)"). Nothing reads it: V4
  # still makes every decision; enforcement and fail-closed are unchanged, and an
  # extractor error is logged and ignored. false, or absent: not run.
  shadow_feature_extraction: true

  # Hybrid Architecture — frozen lightweight Analyzer in SHADOW mode, in a SEPARATE worker
  # process (data_plane/hybrid_shadow_process.py; runtime PROPOSED for D52, not ratified).
  # OFF unless enabled; shown here commented out, deliberately NOT enabled. When on, the
  # Analyzer scores each request in a background task AFTER V4's verdict and logs a
  # "HYBRID SHADOW" line with the same [tag]. V4 stays the only decision; an Analyzer that is
  # unavailable, busy, invalid, failing or slower than timeout_seconds (the worker is then
  # killed and restarted) is a status in that line. Every key is required: no default bound
  # or interpreter is chosen here. The worker needs the analyzer environment
  # (docs/hybrid_shadow_runtime.md): numpy + scikit-learn, which this venv does not have (D33).
  # shadow_analyzer:
  #   enabled: true
  #   runtime: process
  #   python: .venv-analyzer/bin/python
  #   artifact_path: model-output-hybrid-analyzer-v2/recommended.pkl  # SHA-256 verified against
  #                                                                   # the frozen evidence first
  #   timeout_seconds: 0.25            # per analysis; on expiry the worker is SIGKILLed
  #   startup_timeout_seconds: 10      # worker start (imports + artifact load)
  #   restart_backoff_seconds: 2       # minimum wait before replacing a killed/crashed worker
  #   max_consecutive_failures: 3      # then the runtime gives up until the gateway restarts

  # Hybrid Architecture — Fast Path in SHADOW mode (PROPOSED; data_plane/fast_path.py).
  # true: each request is also evaluated for a *hypothetical* FAST_ALLOW and the answer is
  # logged ("FAST PATH (shadow)") beside V4's decision. Nothing reads it: every request still
  # goes to V4, V4 decides, enforcement and fail-closed are unchanged, and an error is logged
  # and ignored. It stays ineligible (logs CONTINUE) until the gateway can supply a
  # canonical-request ACCEPT and VERIFIED wire framing. false, or absent: not run.
  shadow_fast_path: false
  # Owner-supplied policy file (JSON, schema fast-path-policy/v1), relative to the repository
  # root. null or absent: no policy, so the Fast Path can never log FAST_ALLOW.
  fast_path_policy_file: null

  # Issue #68 — canonical-request/v1 OBSERVER in SHADOW mode, in a SEPARATE worker process
  # (data_plane/canonical_observer.py + canonical_worker.py; scope approved D69). OFF unless enabled;
  # shown commented out, deliberately NOT enabled. When on, each request is mapped to a bounded
  # snapshot and canonicalized in a background worker AFTER V4's verdict; a "CANONICAL OBS" line logs
  # the outcome (ACCEPT/REJECT/UNSUPPORTED), reject code, size state, target form and timings — closed
  # codes only, never request text/target/query/header value/body. V4 stays the only decision; the
  # Fast Path stays ineligible because no token budget is set (canonical size UNCHECKED; B is PENDING,
  # §11.2). The worker runs under the DATA-PLANE interpreter (stdlib + the brotli/zstandard mitmproxy
  # ships); it needs NO numpy/scikit-learn (unlike the Analyzer). All values below are LAB-ONLY
  # settings for this observation experiment (D69), not production or ratified operational limits.
  # shadow_canonical_observer:
  #   enabled: true
  #   python: .venv-dataplane/bin/python   # the gateway's own interpreter (data-plane venv)
  #   timeout_seconds: 0.5                  # per observation; on expiry the worker is SIGKILLed + reaped
  #                                         # (~30 ms is an observed synthetic duration, not a worst-case
  #                                         # bound; see D69. Choose the real value from measurement.)
  #   startup_timeout_seconds: 10          # worker start (import canonical_request + decoders)
  #   restart_backoff_seconds: 2           # minimum wait before replacing a killed/crashed worker
  #   max_consecutive_failures: 3          # then the observer gives up until the gateway restarts
  #   max_decoded_body: 1048576            # 1 MiB R8 decode cap (lab); token budget stays unset

  # Issue #68 — per-request HTTP/1.1 framing OBSERVATION (Track A; D70; observe-only).
  # (data_plane/framing_evidence.py). OFF unless set true; shown here deliberately NOT enabled. When
  # on, each request that reaches the hook also gets a "FRAMING OBS" line stating whether the EFFECTIVE
  # mitmproxy runtime profile was the tested one (mitmproxy 12.2.3, validate_inbound_headers=true,
  # HTTP/2 off, reverse-proxy to a loopback port, connection_strategy=lazy) AND the canonical snapshot
  # met the defined conditions (HTTP/1.1 origin/asterisk, complete body, valid correlation, unchanged
  # relevant-profile generation, canonical ACCEPT) → PROFILE_MATCHED; anything else → UNATTESTABLE or
  # UNAVAILABLE with a closed reason. It reuses the canonical observer's ONE bounded snapshot and ONE
  # canonical result (no second canonicalization) and binds the profile to that same snapshot. It NEVER
  # sets fast_path.FRAMING_VERIFIED, feeds the Fast Path, changes GatewayEvidence (framing stays
  # UNAVAILABLE, canonical None), or issues any client-visible reject. PROFILE_MATCHED is NOT a wire
  # VERIFIED, not safe-to-forward, not Fast Path eligibility. Requires the canonical observer above: if
  # true while shadow_canonical_observer is off, every request logs FRAMING OBS UNAVAILABLE and NO
  # worker is started (framing never implicitly enables canonicalization). Lab/observation only (D70).
  shadow_framing_observer: false
